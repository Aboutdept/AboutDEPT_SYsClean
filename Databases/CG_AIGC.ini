; ============================================================================
;  SysClean 规则数据库 — CG / 虚拟制片 / AIGC 软件缓存
; ----------------------------------------------------------------------------
;  语法（winapp2 子集 + SysClean 扩展）：
;    Category=分类名          ; 可选，默认 CG & Post-Production
;    Risk=safe|medium|caution ; 可选，默认 safe
;    DetectFile=路径          ; 安装检测（文件/文件夹，支持通配符），不存在则整条隐藏
;    Detect=HKLM\SOFTWARE\... ; 安装检测（注册表）
;    Default=说明文字
;    Warning=任意值            ; 存在即视为 caution（高危）
;    FileKey1=路径|通配符;通配符|RECURSE|REMOVESELF
;                              ; 第 2 段为空 = 整个目录
;  说明：路径支持 %LocalAppData% %AppData% %ProgramData% %ProgramFiles%
;        %ProgramFiles(x86)% %UserProfile% %Documents% %Temp% %SystemRoot%
;        %SystemDrive% %Public% %OneDrive% 等，支持 * 通配符。
;  安全约定：只做文件/目录清理，不碰注册表；未安装或路径不存在的条目自动不显示
;        （不会产生噪音，也不会被清理）。
; ============================================================================


; ---------------------------------------------------------------------------
;  一、引擎 / 实时渲染（Unreal / Unity / Godot / Omniverse）
; ---------------------------------------------------------------------------

[Unity Shader Cache]
Category=CG & Post-Production
Risk=safe
DetectFile=%LocalAppData%\Unity
FileKey1=%LocalAppData%\Unity\ShaderCache|*|RECURSE
Default=Unity 编辑器着色器编译缓存，随项目累积可达数 GB，删除后自动重建。

[Unity Hub 下载缓存]
Category=CG & Post-Production
Risk=safe
DetectFile=%LocalAppData%\Unity
FileKey1=%LocalAppData%\Unity\cache|*|RECURSE
Default=Unity Hub 下载的编辑器安装包/模块缓存，安装完毕后不再需要。

[Unity 编辑器日志]
Category=CG & Post-Production
Risk=safe
DetectFile=%LocalAppData%\Unity
FileKey1=%LocalAppData%\Unity\Editor|*.log
Default=Unity Editor.log / Editor_prev.log，仅排障用。

[Unity Asset 导入缓存]
Category=CG & Post-Production
Risk=medium
DetectFile=%LocalAppData%\Unity
FileKey1=%LocalAppData%\Unity\Asset Import Cache|*|RECURSE
Default=Unity 资源导入缓存（Library 之外的一份），删除后重新导入资源会变慢。

[Godot 项目缓存]
Category=CG & Post-Production
Risk=medium
DetectFile=%AppData%\Godot
FileKey1=%AppData%\Godot|*.log;*.tmp
Default=Godot 引擎日志与临时文件。

[Omniverse 缓存]
Category=CG & Post-Production
Risk=safe
DetectFile=%LocalAppData%\ov
FileKey1=%LocalAppData%\ov\cache|*|RECURSE
Default=NVIDIA Omniverse 本地缓存（Kit/Nucleus 客户端数据）。

[Omniverse 日志]
Category=CG & Post-Production
Risk=safe
DetectFile=%LocalAppData%\ov
FileKey1=%LocalAppData%\ov\logs|*.log;*.log.*|RECURSE
Default=NVIDIA Omniverse 运行日志。

[Unreal Engine 崩溃转储]
Category=CG & Post-Production
Risk=safe
DetectFile=%LocalAppData%\UnrealEngine
FileKey1=%LocalAppData%\CrashDumps|UE4*;UE5*|RECURSE
Default=虚幻引擎崩溃时生成的 dmp/log，仅排障用。


