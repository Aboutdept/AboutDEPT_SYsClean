; ============================================================================
;  SysClean 规则数据库 — Windows 系统补充项
;  来源：Dism++ (Chuyu-Team/Dism-Multi-language) Data.xml 的 CleanCollection4
;        路径型清理项，经人工筛选，只保留「纯文件/目录删除」条目；
;        涉及 WinSxS 组件清理、系统还原点、Appx 卸载、注册表写入的条目一律剔除
;        （SysClean 原则：不做注册表操作、不调系统 API）。
;  另补充 BleachBit / privacy.sexy 等开源清理工具常见的通用缓存位置。
; ============================================================================

[CBS 临时文件]
Category=Windows Update
Risk=safe
FileKey1=%SystemRoot%\CbsTemp|*|RECURSE
Default=CBS（组件服务）临时目录，Windows 更新残留。

[WinSxS 清单缓存]
Category=Windows Update
Risk=safe
FileKey1=%SystemRoot%\WinSxS\ManifestCache|*|RECURSE
Default=WinSxS 清单缓存（不要手动删除 WinSxS 本体）。

[Windows 更新安装日志]
Category=System Logs
Risk=safe
FileKey1=%SystemRoot%|*.log;*.etl
Default=Windows 根目录下 CBS/DISM 等安装日志（不含系统文件）。

[LiveKernelReports]
Category=System Logs
Risk=safe
FileKey1=%SystemRoot%\LiveKernelReports|*|RECURSE
Default=Windows 内核实时报告（Live Dump），仅排障用。

[WinSAT 性能数据]
Category=System Logs
Risk=safe
FileKey1=%SystemRoot%\Performance\WinSAT\DataStore|*|RECURSE
Default=Windows 体验指数（WinSAT）评估数据，重新评估会重写。

[INetCache 网页缓存]
Category=System Cache
Risk=safe
FileKey1=%LocalAppData%\Microsoft\Windows\INetCache|*|RECURSE
Default=WinINet/IE 网页缓存（Edge/Chrome 另有独立缓存）。

[INetCookies]
Category=System Cache
Risk=medium
FileKey1=%LocalAppData%\Microsoft\Windows\INetCookies|*|RECURSE
Default=IE/WinINet Cookies，清理后部分站点需重新登录。

[系统服务配置文件缓存]
Category=System Cache
Risk=safe
FileKey1=%SystemRoot%\ServiceProfiles\*\AppData\Local\Microsoft\Windows\INetCache|*|RECURSE
Default=系统服务账户的网页缓存。

[Terminal Server Client 缓存]
Category=System Cache
Risk=safe
FileKey1=%LocalAppData%\Microsoft\Terminal Server Client\Cache|*|RECURSE
Default=远程桌面连接缓存（不含已保存凭据）。

[Windows 缩略图缓存]
Category=System Cache
Risk=safe
FileKey1=%LocalAppData%\Microsoft\Windows\Explorer|thumbcache_*.db;iconcache_*.db
Default=资源管理器缩略图与图标缓存，删除后自动重建。

[终端服务 XDE 缓存]
Category=System Cache
Risk=safe
FileKey1=%ProgramData%\Microsoft\XDE|*|RECURSE
Default=XDE（Xbox/设备仿真）缓存。

[Windows Defender 扫描历史]
Category=System Logs
Risk=safe
FileKey1=%ProgramData%\Microsoft\Windows Defender\Scans\History|*|RECURSE
Default=Defender 扫描历史记录（不影响病毒库与实时防护）。

[零售演示离线内容]
Category=Other
Risk=safe
FileKey1=%ProgramData%\Microsoft\Windows\RetailDemo|*|RECURSE
Default=零售演示模式（Retail Demo）离线内容，普通用户不会有。

[.NET 本机映像缓存]
Category=Dev Tools
Risk=medium
FileKey1=%SystemRoot%\assembly\NativeImages_v*|*|RECURSE
Default=.NET NGen 本机映像缓存，删除后 .NET 程序首次启动需重新生成本机映像。

[.NET 程序集临时]
Category=Dev Tools
Risk=safe
FileKey1=%SystemRoot%\assembly\temp|*|RECURSE
Default=.NET 程序集安装临时目录。
FileKey2=%SystemRoot%\assembly\tmp|*|RECURSE

[NuGet 全局包缓存]
Category=Dev Tools
Risk=medium
FileKey1=%UserProfile%\.nuget\packages|*|RECURSE
Default=NuGet 全局包缓存，删除后恢复编译需重新还原（联网）。

[Visual Studio 跟踪调试]
Category=Dev Tools
Risk=safe
FileKey1=%ProgramData%\Microsoft Visual Studio\*\TraceDebugging|*|RECURSE
Default=VS IntelliTrace/跟踪调试数据。

[VS 安装源 Package Cache]
Category=Dev Tools
Risk=medium
FileKey1=%ProgramData%\Package Cache|*|RECURSE
Default=Burn/VS 安装程序缓存（占用常达数 GB）。删除后修复/卸载 VS 需重新下载。

[WebPI 缓存]
Category=Dev Tools
Risk=safe
FileKey1=%LocalAppData%\Microsoft\Web Platform Installer|*|RECURSE
Default=Microsoft Web Platform Installer 缓存。

[UWP 应用 AC Temp]
Category=System Cache
Risk=safe
FileKey1=%LocalAppData%\Packages\*\AC\Temp|*|RECURSE
Default=UWP 应用临时目录（含 Store 应用缓存）。

[Windows 预读取 Prefetch]
Category=System Cache
Risk=medium
FileKey1=%SystemRoot%\Prefetch|*.pf
Default=Prefetch 预读取文件，删除后短期内程序启动可能变慢（系统会自动重建）。

[字体缓存]
Category=System Cache
Risk=safe
FileKey1=%SystemRoot%\ServiceProfiles\LocalService\AppData\Local\FontCache|*.* 
Default=Windows 字体缓存，删除后自动重建。

[驱动安装临时]
Category=Other
Risk=safe
FileKey1=%SystemDrive%|*.tmp;*.log
Default=系统盘根目录残留的驱动解压/安装临时文件（仅文件，不含目录）。

[NVIDIA 驱动下载缓存]
Category=App Cache
Risk=safe
FileKey1=%ProgramData%\NVIDIA Corporation\Downloader|*|RECURSE
Default=NVIDIA 驱动安装包下载缓存。

[JetBrains 日志与缓存]
Category=Dev Tools
Risk=safe
FileKey1=%LocalAppData%\JetBrains\*\caches|*.tmp;*.log|RECURSE
Default=JetBrains 系列 IDE（Rider/CLion/PyCharm）日志与临时缓存。

[Windows 应用商店缓存]
Category=System Cache
Risk=safe
FileKey1=%LocalAppData%\Packages\Microsoft.WindowsStore_8wekyb3d8bbwe\LocalCache|*|RECURSE
Default=Microsoft Store 本地缓存。
